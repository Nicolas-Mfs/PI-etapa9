<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Clientes</title>
  <style>
    body { font-family: Arial; margin: 30px; }
    input, button { padding: 6px; margin: 4px; }
    table { border-collapse: collapse; margin-top: 15px; width: 600px; }
    th, td { border: 1px solid #ccc; padding: 8px; }
  </style>
</head>
<body>
  <h1>Cadastro de Clientes</h1>

  <input type="hidden" id="id">
  <input type="text" id="nome" placeholder="Nome">
  <input type="text" id="cpf" placeholder="CPF">
  <button onclick="salvar()">Salvar</button>
  <button onclick="limpar()">Limpar</button>
  <p id="mensagem"></p>

  <table>
    <thead><tr><th>ID</th><th>Nome</th><th>CPF</th><th>Ações</th></tr></thead>
    <tbody id="tabela"></tbody>
  </table>

<script>
  const API = "/api/clientes";

  async function listar() {
    const resp = await fetch(API);
    const clientes = await resp.json();
    document.getElementById("tabela").innerHTML = clientes.map(c => `
      <tr>
        <td>${c.id}</td><td>${c.nome}</td><td>${c.cpf}</td>
        <td>
          <button onclick="editar(${c.id}, '${c.nome}', '${c.cpf}')">Editar</button>
          <button onclick="excluir(${c.id})">Excluir</button>
        </td>
      </tr>`).join("");
  }

  async function salvar() {
    const id = document.getElementById("id").value;
    const cliente = {
      nome: document.getElementById("nome").value,
      cpf: document.getElementById("cpf").value
    };
    const resp = await fetch(id ? `${API}/${id}` : API, {
      method: id ? "PUT" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cliente)
    });
    if (!resp.ok) {
      const erro = await resp.json();
      mostrar(erro.erro, "red");
      return;
    }
    mostrar(id ? "Cliente atualizado!" : "Cliente cadastrado!", "green");
    limpar();
    listar();
  }

  function editar(id, nome, cpf) {
    document.getElementById("id").value = id;
    document.getElementById("nome").value = nome;
    document.getElementById("cpf").value = cpf;
  }

  async function excluir(id) {
    if (!confirm("Deseja excluir este cliente?")) return;
    await fetch(`${API}/${id}`, { method: "DELETE" });
    mostrar("Cliente excluído!", "green");
    listar();
  }

  function limpar() {
    document.getElementById("id").value = "";
    document.getElementById("nome").value = "";
    document.getElementById("cpf").value = "";
  }

  function mostrar(texto, cor) {
    const m = document.getElementById("mensagem");
    m.style.color = cor;
    m.textContent = texto;
  }

  listar();
</script>
</body>
</html>
